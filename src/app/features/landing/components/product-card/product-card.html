<img class="decoration pointer-events-none absolute -top-8.5 right-2 z-2 w-24 rotate-[18deg] drop-shadow-[0_0.5rem_0.5625rem_#33332255] transition-transform duration-400 max-[47.5rem]:hidden" [src]="decoration()" alt="" aria-hidden="true" loading="lazy" />
<article class="group relative z-1 overflow-hidden rounded-sm border border-[#e9e8df] bg-[#fffefa]">
  <div class="relative grid aspect-[1.08] place-items-center overflow-hidden bg-[#f3edda]" [class.bg-[#f5e8de]]="product().accent === 'peach'" [class.bg-[#f3e9e5]]="product().accent === 'rose'" [class.bg-[#e9eee5]]="product().accent === 'sage'" [class.bg-[#efebf0]]="product().accent === 'lilac'">
    <img class="absolute inset-0 size-full object-cover transition-transform duration-500 ease-[cubic-bezier(0.2,0.7,0.2,1)] group-hover:scale-[1.045]" [src]="currentImage().src" [alt]="currentImage().alt" loading="lazy" />
    @if (product().images.length > 1) {
      <div class="absolute inset-0 z-2" [attr.aria-label]="'Fotos de ' + product().name">
        <button class="group/gallery absolute inset-0 size-full touch-manipulation focus-visible:-outline-offset-4" type="button" (click)="nextImage()" [attr.aria-label]="'Ver siguiente foto de ' + product().name">
          <span class="absolute right-3 bottom-3 inline-flex min-h-9.5 items-center gap-1.25 rounded-6.25 bg-[#fffefad9] py-0.75 pr-1.75 pl-3 text-[#34432d] opacity-60 transition-[background,opacity] duration-200 group-hover/gallery:bg-[#fffefa] group-hover/gallery:opacity-100 group-focus-visible/gallery:bg-[#fffefa] group-focus-visible/gallery:opacity-100">
            <span class="text-[0.6875rem] font-semibold" aria-live="polite">{{ imageIndex() + 1 }} / {{ product().images.length }}</span>
            <svg lucideChevronRight [size]="18" aria-hidden="true"></svg>
          </span>
        </button>
      </div>
    }
  </div>
  <div class="px-4.5 pt-4.5 pb-5 max-[27.5rem]:px-2.75 max-[27.5rem]:pt-3.5 max-[27.5rem]:pb-4">
    <div>
      <h3 class="font-[Georgia] text-[1.5625rem] font-normal tracking-[-0.035em] max-[47.5rem]:text-[1.375rem] max-[27.5rem]:text-[1.1875rem]">{{ product().name }}</h3>
      <p class="mt-1.5 text-[0.8125rem] text-[#8d8e84] max-[27.5rem]:min-h-8 max-[27.5rem]:text-xs max-[27.5rem]:leading-[1.4]">{{ product().description }}</p>
    </div>
    <div class="mt-5.25 flex items-center justify-between gap-2.5 max-[47.5rem]:mt-0 max-[47.5rem]:flex-col max-[47.5rem]:items-start max-[47.5rem]:gap-3.25">
      <span class="text-[1.0625rem] font-bold max-[27.5rem]:text-[0.9375rem]">{{ product().price | currency:'ARS':'symbol-narrow':'1.0-0':'es-AR' }}</span>
      <div class="flex items-center gap-2 max-[47.5rem]:self-end max-[27.5rem]:gap-1.25">
        @if (quantityInCart() > 0) {
          <button class="inline-flex items-center gap-1 whitespace-nowrap px-0.5 py-1.25 text-xs font-bold text-[#526641] hover:text-[#283b21]" type="button" (click)="openCart.emit()" [attr.aria-label]="'Abrir carrito: ' + quantityInCart() + ' de ' + product().name">
            <svg lucideShoppingBag [size]="15" aria-hidden="true"></svg>{{ quantityInCart() }}
          </button>
        }
        <button class="inline-flex min-h-10.25 items-center gap-1.75 rounded-0.75 border border-[#687a53] px-3.75 text-xs font-bold text-[#4b613b] transition-colors duration-200 hover:bg-[#53683e] hover:text-white max-[27.5rem]:min-h-9 max-[27.5rem]:px-2.25 max-[27.5rem]:text-[0.6875rem]" type="button" (click)="add.emit(product())" [attr.aria-label]="'Agregar ' + product().name + ' al carrito'">
          <svg lucidePlus [size]="16" aria-hidden="true" class="shrink-0"></svg> Agregar
        </button>
      </div>
    </div>
  </div>
</article>
